spring:
  application:
    name: adi-vritti-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/adivritti}
    username: ${SPRING_DATASOURCE_USERNAME:adivritti}
    password: ${SPRING_DATASOURCE_PASSWORD:adivritti_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
  cache:
    type: redis
  jackson:
    # docs/openapi/core.yaml is the contract and it is snake_case end to end
    # (claim_id, valid_until, page_size, include_expired, ...). Without this the
    # runtime emitted camelCase, so every generated client failed to bind a single
    # field, and contract-legal request bodies were rejected by bean validation.
    property-naming-strategy: SNAKE_CASE

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  govsim:
    base-url: ${GOVSIM_BASE_URL:http://localhost:4000}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:documents}
  ai-service:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    # Service-to-service credential, and it must match the token the AI service is
    # started with. Every AI route except /health rejects calls without it, so an
    # unset value here quietly disables document-assisted verification.
    token: ${AI_SERVICE_TOKEN:}
  verification:
    cache-ttl-seconds: ${VERIFICATION_CACHE_TTL_SECONDS:3600}
    dashboard-cache-ttl-seconds: ${DASHBOARD_CACHE_TTL_SECONDS:300}
  aadhaar:
    # REQUIRED. base64 of >=32 random bytes. No default: the app refuses to start
    # without it, because a guessable key makes every reference key reversible.
    vault-hmac-key: ${AADHAAR_VAULT_HMAC_KEY:}
    vault-key-id: ${AADHAAR_VAULT_KEY_ID:v1}
    enforce-verhoeff: ${AADHAAR_ENFORCE_VERHOEFF:true}
  vault:
    # REQUIRED. base64 of exactly 32 random bytes (AES-256-GCM claim sealing).
    encryption-key: ${CLAIM_VAULT_KEY:}
  rules-path: ${RULES_PATH:../../packages/rules}
  security:
    # Escape hatch for local demos only. Must be explicitly enabled; the prod
    # profile refuses to start with this on.
    allow-insecure-dev: ${ALLOW_INSECURE_DEV:false}
    jwt:
      # Either a shared HS256 secret (>=32 bytes base64) ...
      hmac-secret: ${JWT_HMAC_SECRET:}
      # ... or a JWKS endpoint for RS256/ES256 asymmetric verification.
      jwk-set-uri: ${JWT_JWK_SET_URI:}
      issuer: ${JWT_ISSUER:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
