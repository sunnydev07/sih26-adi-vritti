[project]
name = "adi-vritti-ai"
version = "1.0.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]",
    "pydantic>=2.0",
    "pydantic-settings",
    "sqlalchemy>=2.0",
    "pgvector",
    "psycopg[binary]",
    "httpx",
    "python-multipart",
    "pillow",
    "pytesseract",
    "langchain-core",
    "langchain-community",
    "pytest",
    "pytest-asyncio",
]

[tool.ruff]
target-version = "py313"
line-length = 100
