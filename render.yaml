# Render Blueprint — Adi-Vritti Student Portal (Static Web)
services:
  - type: web
    name: adi-vritti-student
    runtime: static
    rootDir: apps/mobile
    buildCommand: npm install && npx expo export --platform web
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
