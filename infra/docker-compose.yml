# ============================================================================
# DEVELOPMENT ONLY. Do not deploy this file.
#
# Every secret in here is a published constant committed on purpose so that
# `make dev` works from a fresh clone with zero setup, and the default profile is
# `dev`, which sets app.security.allow-insecure-dev=true in Core. That makes
# SecurityConfig apply anyRequest().permitAll(): the whole Core API on published
# port 8080 answers unauthenticated callers, /actuator/metrics and
# /actuator/health included. The AI service likewise boots with the published
# dev-only token and the explicit ALLOW_INSECURE_DEV opt-in below.
#
# For any real environment you must at minimum:
#   SPRING_PROFILES_ACTIVE=prod
#     Selects application-prod.yml, which sets allow-insecure-dev=false and
#     enforce-verhoeff=true. Two interlocks back this up: SecurityConfig only
#     opens its unauthenticated demo mode when the profiles are exactly {dev}
#     (the flag is ignored loudly everywhere else), and ProductionSecretGuard
#     refuses to boot any non-dev profile on the published constants below.
#     Booting the dev profile in production is still wide open by design --
#     that is the hazard: forget SPRING_PROFILES_ACTIVE and the service starts
#     happily, with no refusal and no warning beyond WARN lines in the log.
#   AADHAAR_VAULT_HMAC_KEY, CLAIM_VAULT_KEY, JWT_HMAC_SECRET, GAP_HMAC_SALT,
#   AI_SERVICE_TOKEN, CORE_SERVICE_TOKEN, POSTGRES_PASSWORD
#     All real values, all from your secret store, none of the defaults below.
#     The prod profile fails fast on a missing or malformed JWT key, and the
#     guard fails fast when any value is still a published dev constant.
#
# The defaults are still overridable from the environment, so this file can be a
# starting point, but it is not a deployment manifest.
#
# There is deliberately NO object-storage service here. A minio service used to
# sit in this file, but nothing ever read it (no client, no config bindings),
# and its image became unpullable: MinIO removed minio/minio from Docker Hub
# in 2025, which broke `docker compose up` for the whole stack after every
# image had built fine. When document storage actually lands, re-add the
# service with an image under quay.io/minio/minio and let CI prove the pull.
# ============================================================================
services:
  postgres:
    # MUST be a pgvector build: infra/init-db.sql runs `CREATE EXTENSION vector`
    # and the stock postgres image has no such extension, so on postgres:16 the
    # init script aborts and the container never becomes healthy — taking the
    # whole stack down with it.
    #
    # UPGRADING FROM THE PRE-PGVECTOR STACK: the official entrypoint executes
    # /docker-entrypoint-initdb.d/*.sql ONLY when PGDATA is empty. The `pgdata`
    # volume below already exists from the earlier postgres:16 run, so this
    # init.sql will never execute on an existing checkout. The container still
    # passes pg_isready and reports healthy while the vector extension is
    # silently absent, and the first vector DDL later fails. Fix it exactly once,
    # either:
    #   make clean
    #     (docker compose -f infra/docker-compose.yml down -v -- destroys data)
    # or, to keep the data:
    #   make dev-detach && make init-db
    # See infra/init-db.sql and the init-db target in the Makefile.
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      # Interpolated (not hardcoded) so POSTGRES_USER=myuser actually reaches
      # the database: Core already reads the same variables, and a hardcoded
      # postgres side with an interpolated Core side meant custom credentials
      # created the DB as adivritti/adivritti_dev while Core tried myuser/...
      # and crash-looped on password authentication failure.
      POSTGRES_DB: ${POSTGRES_DB:-adivritti}
      POSTGRES_USER: ${POSTGRES_USER:-adivritti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adivritti_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-adivritti}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  govsim:
    build: ../services/govsim
    ports: ["4000:4000"]
    environment:
      CHAOS_ENABLED: "true"
      CHAOS_ERROR_RATE: "0.08"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    build: ../services/core
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      govsim:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-adivritti}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-adivritti}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-adivritti_dev}
      SPRING_REDIS_HOST: redis
      GOVSIM_BASE_URL: http://govsim:4000
      # Without this the service falls back to localhost:8000 and calls itself.
      AI_SERVICE_URL: http://ai:8000
      # Core presents this to the AI service on /docai/parse. Every AI route
      # except /health rejects calls without it, so an unset value here makes
      # document-assisted verification fail on 401 and the whole tier goes
      # quiet. Must match AI_SERVICE_TOKEN on the ai service below.
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-ai-service-token}
      # Rules-as-data is read from outside the JAR.
      RULES_PATH: /rules
      # Required: the service refuses to start without these. The development
      # defaults below are exactly 32 bytes each and MUST be overridden before
      # any real deployment. CLAIM_VAULT_KEY is an AES-256 key, so its length
      # is load-bearing -- a non-32-byte key throws InvalidKeyException the
      # first time a claim is sealed, not at boot.
      AADHAAR_VAULT_HMAC_KEY: ${AADHAAR_VAULT_HMAC_KEY:-ZGV2LW9ubHktaG1hYy1rZXktMzItYnl0ZXMtbG9uZyE=}
      AADHAAR_VAULT_KEY_ID: ${AADHAAR_VAULT_KEY_ID:-v1}
      CLAIM_VAULT_KEY: ${CLAIM_VAULT_KEY:-ZGV2LW9ubHktYWVzMjU2LWtleS0zMi1ieXRlcy1sb24=}
      JWT_HMAC_SECRET: ${JWT_HMAC_SECRET:-ZGV2LW9ubHktand0LXNlY3JldC0zMi1ieXRlcy1sb24=}
      # Hosts the DocAI tier may fetch caller-supplied evidence URLs from. The
      # dev stack needs the mock hostnames (single-label docker names resolve
      # to site-local addresses and would otherwise be rejected); a real
      # deployment lists its document-store domains here.
      EVIDENCE_ALLOWED_HOSTS: ${EVIDENCE_ALLOWED_HOSTS:-govsim,minio}
    volumes:
      - ../packages/rules:/rules:ro

  ai:
    build: ../services/ai
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      core:
        condition: service_started
    environment:
      CORE_SERVICE_URL: http://core:8080
      # Required by the privacy-preserving gap join; a shared, rotating salt.
      GAP_HMAC_SALT: ${GAP_HMAC_SALT:-dev-salt-rotate-in-prod}
      # Service-to-service credential. Every AI route except /health requires it;
      # without it, /gap/hash would accept raw Aadhaar references from anyone who
      # can reach the port, which is exactly the raw-PII transfer the design
      # claims to avoid.
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-dev-only-ai-service-token}
      # DEV ONLY. The AI service refuses to run with the published
      # dev-only-ai-service-token above unless this is explicitly true, so
      # without it every route except /health comes back 503 and `make dev`
      # starts a service that cannot do anything. Setting it to "true" in any
      # real deployment re-opens /gap/hash to anonymous callers, which defeats
      # the whole privacy design of the coverage-gap join -- so there it must be
      # false or absent, alongside a real AI_SERVICE_TOKEN.
      ALLOW_INSECURE_DEV: "true"
      # Cap on /docai/parse uploads. Protects against a single request exhausting
      # container memory.
      DOCAI_MAX_UPLOAD_BYTES: ${DOCAI_MAX_UPLOAD_BYTES:-5242880}
      # Bearer token the AI service presents to Core on proxied calls.
      #
      # The comment that used to sit here claimed Core requires JWT auth, so
      # without this "every JAGO proxy call comes back 401/403". That is false
      # for this compose file: SPRING_PROFILES_ACTIVE defaults to dev, and
      # application-dev.yml sets app.security.allow-insecure-dev=true, which
      # makes SecurityConfig override the chain with anyRequest().permitAll().
      # On this stack every Core route, /actuator/** included, accepts an
      # unauthenticated request, so this variable is currently inert.
      # Outside the dev profile it is not a substitute for auth either: Core
      # verifies a real signed JWT (JWKS, or a shared HS256 secret), and an
      # opaque string in this field will not be accepted as one. Treat it as an
      # unfinished integration, not as the thing that makes proxied calls work.
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


volumes:
  pgdata:
