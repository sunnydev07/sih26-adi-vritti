# Local development override. Opt in explicitly:
#   make dev COMPOSE="docker compose -f infra/docker-compose.yml -f infra/docker-compose.override.yml"
#
# It is NOT auto-loaded, because Docker Compose only auto-merges a file literally
# named docker-compose.override.yml sitting next to the file passed with -f, and
# the Makefile always passes infra/docker-compose.yml explicitly.
#
# Each mount is hot-reload for a service that runs from source.
services:
  govsim:
    volumes:
      - ../services/govsim/src:/app/src:ro
    environment:
      # Chaos off by default for the override: a deterministic stack is much
      # easier to develop against than one returning random 500s.
      CHAOS_ENABLED: "false"

  ai:
    volumes:
      - ../services/ai/app:/app/app:ro

  # No core mount: the runtime image contains only the packaged boot JAR
  # (app.jar), so there is no /app/src to shadow. Java changes need
  # `make rebuild`.
  core:
    environment:
      # The rules JSON is mounted read-only by the base file, so an edit cannot be
      # watched for; this clears the in-process rule cache instead, which is what
      # makes the hot-reload claim below true. 2s is a dev-only value.
      APP_RULES_WATCH_INTERVAL_MS: "2000"

# The rules-as-data JSON mounted from packages/rules by the base file does
# hot-reload — but only via the cache invalidation above, not via an inotify
# watch on the read-only mount. `scheme_rule_version` is still written at
# startup, so a rule edit is visible on disk immediately and in the mirror
# after the next `make rebuild`.
