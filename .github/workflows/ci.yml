name: ci

# Live verification for the Adi-Vritti stack. The unit suites run natively;
# the `stack` job boots the real compose stack (fresh volumes, so the
# /docker-entrypoint-initdb.d script runs for real) and asserts the three
# things that have actually bitten us: the pgvector extension, the Flyway
# V1 migration, and the AI service auth gate.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Fast loop for the schema itself. Applying the real migration against a real
  # pgvector database takes seconds, so a SQL mistake shows up in ~1 minute
  # instead of after a Spring Boot container build and boot. The stack job below
  # still verifies the whole thing end to end, but this is where you iterate.
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: adivritti
          POSTGRES_USER: adivritti
          POSTGRES_PASSWORD: adivritti_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U adivritti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply init-db.sql (extensions)
        run: |
          set +e
          out=$(psql "postgresql://adivritti:adivritti_dev@localhost:5432/adivritti" \
            -v ON_ERROR_STOP=1 -q -f infra/init-db.sql 2>&1); rc=$?
          if [ $rc -ne 0 ]; then
            echo "$out" | while IFS= read -r l; do echo "::error title=init-db.sql::${l}"; done
            exit 1
          fi
          echo "$out"

      - name: Apply V1__initial_schema.sql
        run: |
          set +e
          out=$(psql "postgresql://adivritti:adivritti_dev@localhost:5432/adivritti" \
            -v ON_ERROR_STOP=1 -f services/core/src/main/resources/db/migration/V1__initial_schema.sql 2>&1); rc=$?
          if [ $rc -ne 0 ]; then
            echo "$out" | while IFS= read -r l; do echo "::error title=V1__initial_schema.sql::${l}"; done
            exit 1
          fi
          echo "$out" | tail -20

      - name: Apply V2__idempotency.sql
        run: |
          set +e
          out=$(psql "postgresql://adivritti:adivritti_dev@localhost:5432/adivritti" \
            -v ON_ERROR_STOP=1 -f services/core/src/main/resources/db/migration/V2__idempotency.sql 2>&1); rc=$?
          if [ $rc -ne 0 ]; then
            echo "$out" | while IFS= read -r l; do echo "::error title=V2__idempotency.sql::${l}"; done
            exit 1
          fi
          echo "$out" | tail -10

      - name: Assert the schema landed
        run: |
          url="postgresql://adivritti:adivritti_dev@localhost:5432/adivritti"
          n=$(psql "$url" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public';")
          echo "public tables: $n"
          [ "$n" -ge 13 ] || { echo "::error title=V1+V2::expected >=13 tables, found $n"; exit 1; }
          psql "$url" -tAc "SELECT extname FROM pg_extension WHERE extname='vector';"
          psql "$url" -tAc "SELECT to_regclass('public.identity_resolution');"
          psql "$url" -tAc "SELECT column_name FROM information_schema.columns WHERE table_name='claim' AND column_name='idempotency_key';"

      - name: Re-running V1 must be a no-op
        run: |
          # The migration claims to be idempotent, so the append-only guard
          # functions and IF NOT EXISTS DDL must survive a second pass.
          psql "postgresql://adivritti:adivritti_dev@localhost:5432/adivritti" \
            -v ON_ERROR_STOP=1 -q \
            -f services/core/src/main/resources/db/migration/V1__initial_schema.sql

      - name: Re-running V2 must be a no-op
        run: |
          # IF NOT EXISTS DDL plus the partial unique index must survive a
          # second pass (ALTER TABLE ... ADD COLUMN IF NOT EXISTS is safe;
          # CREATE UNIQUE INDEX IF NOT EXISTS is safe).
          psql "postgresql://adivritti:adivritti_dev@localhost:5432/adivritti" \
            -v ON_ERROR_STOP=1 -q \
            -f services/core/src/main/resources/db/migration/V2__idempotency.sql

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build -PjavaToolchainVersion=21 --console=plain
        working-directory: services/core

  ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
        working-directory: services/ai
      - run: python -m pytest tests/ -q
        working-directory: services/ai

  api-client:
    # The generated client is gitignored by design (regenerable artifact), so
    # this job proves the contract is generatable and the output compiles.
    # A red job here means docs/openapi/core.yaml broke `make api`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
        working-directory: packages/api-client
      - run: npm run generate
        working-directory: packages/api-client
      - name: Typecheck the generated TypeScript client
        run: |
          npm install --no-save --no-audit --no-fund typescript@5.6
          files=$(cd typescript && ls index.ts runtime.ts apis/*.ts models/*.ts | sed 's|^|typescript/|')
          ./node_modules/.bin/tsc --noEmit --strict --skipLibCheck \
            --target es2020 --lib es2020,dom --module esnext --moduleResolution bundler \
            $files
        working-directory: packages/api-client

  govsim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/govsim/package-lock.json
      - run: npm ci
        working-directory: services/govsim
      - run: npm test
        working-directory: services/govsim

  token-mirrors:
    # packages/ui-tokens is the single source of truth, but mobile carries a
    # git-tracked vendor copy (Expo cannot resolve the workspace package) and
    # the AI help lane reads its own help_faq.json path. Both must stay
    # byte-identical to the canonical files; a red job means someone edited
    # one side without re-running the sync.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-token-mirrors.mjs

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Render-only: catches YAML errors, bad depends_on conditions and
      # unset interpolation variables without starting a container.
      - name: Validate compose config
        run: docker compose -f infra/docker-compose.yml config > /dev/null

      - name: Build images
        run: docker compose -f infra/docker-compose.yml build

      - name: Start stack
        run: docker compose -f infra/docker-compose.yml up -d

      - name: Postgres carries the vector extension
        run: |
          set +e
          for i in $(seq 1 36); do
            got=$(docker compose -f infra/docker-compose.yml exec -T postgres \
              psql -U adivritti -d adivritti -tAc \
              "SELECT 1 FROM pg_extension WHERE extname='vector';" 2>/dev/null)
            if [ "$got" = "1" ]; then
              echo "vector extension present"; exit 0
            fi
            sleep 5
          done
          echo "::error title=pgvector::vector extension never appeared"
          exit 1

      - name: Flyway V1+V2 migrations applied
        run: |
          set +e
          for i in $(seq 1 96); do
            got=$(docker compose -f infra/docker-compose.yml exec -T postgres \
              psql -U adivritti -d adivritti -tAc \
              "SELECT version FROM flyway_schema_history ORDER BY installed_rank DESC LIMIT 1;" 2>/dev/null)
            if [ "$got" = "2" ]; then
              echo "V1+V2 applied"; exit 0
            fi
            sleep 5
          done
          echo "::error title=flyway::flyway_schema_history never gained V2 after 480s"
          exit 1

      - name: Core actuator reports UP
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "core UP"; exit 0
            fi
            sleep 5
          done
          echo "core never reported UP"; exit 1

      - name: AI and govsim health
        run: |
          curl -sf http://localhost:8000/health > /dev/null
          curl -sf http://localhost:4000/health > /dev/null

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Contract drift check (core.yaml vs running app)
        run: |
          # springdoc regenerates the spec from the live controllers; the
          # hand-written contract must match it structurally. A red step here
          # means a controller changed without updating docs/openapi/core.yaml
          # (or vice versa) — fix the drift, do not delete the check.
          curl -sf http://localhost:8080/v3/api-docs > "$RUNNER_TEMP/live.json"
          npx -y js-yaml@4 docs/openapi/core.yaml > "$RUNNER_TEMP/core.json"
          node scripts/check-contract-drift.mjs "$RUNNER_TEMP/core.json" "$RUNNER_TEMP/live.json"

      - name: AI auth gate is live
        run: |
          # No token: the raw-PII route must refuse.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/gap/hash \
            -H "Content-Type: application/json" -d '{"aadhaar_ref":"CI-SMOKE-001"}')
          [ "$code" = "401" ] || { echo "expected 401 without token, got $code"; exit 1; }
          # Dev token: the join key must come back.
          body=$(curl -s -X POST http://localhost:8000/gap/hash \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer dev-only-ai-service-token" \
            -d '{"aadhaar_ref":"CI-SMOKE-001"}')
          echo "$body" | grep -q hashed_key || { echo "no hashed_key in: $body"; exit 1; }

      - name: Diagnose the failure
        if: failure()
        # One step, small and ordered. Earlier versions spread this over several
        # steps and matched on "Could not", which Spring Data Redis emits as INFO
        # for every JPA repository, so the annotations filled up with harmless
        # noise and the actual error never made it out. Tail first: the cause of
        # a startup failure is in the last lines.
        run: |
          f="$RUNNER_TEMP/core-full.log"
          docker compose -f infra/docker-compose.yml logs --no-color core > "$f" 2>&1 || true
          echo "::error title=core::log lines: $(wc -l < "$f")"
          echo "::error title=core::---- last 12 lines ----"
          tail -12 "$f" | while IFS= read -r l; do echo "::error title=core tail::${l}"; done
          echo "::error title=core::---- error lines ----"
          grep -E 'ERROR|FATAL|APPLICATION FAILED TO START|Caused by:' "$f" | head -8 \
            | while IFS= read -r l; do echo "::error title=core err::${l}"; done
          echo "::error title=core::---- container state ----"
          cid=$(docker compose -f infra/docker-compose.yml ps -aq core 2>/dev/null)
          if [ -n "$cid" ]; then
            echo "::error title=core::status=$(docker inspect -f '{{.State.Status}}' "$cid") exit=$(docker inspect -f '{{.State.ExitCode}}' "$cid") oom=$(docker inspect -f '{{.State.OOMKilled}}' "$cid") started=$(docker inspect -f '{{.State.StartedAt}}' "$cid") finished=$(docker inspect -f '{{.State.FinishedAt}}' "$cid")"
          fi

      - name: Thread dump of a still-running core
        if: failure()
        # SIGQUIT dumps every thread stack to stdout, which lands in the
        # container log, and needs no jstack (the runtime image is a JRE).
        run: |
          cid=$(docker compose -f infra/docker-compose.yml ps -q core 2>/dev/null)
          if [ -z "$cid" ]; then exit 0; fi
          [ "$(docker inspect -f '{{.State.Status}}' "$cid")" = "running" ] || exit 0
          docker compose -f infra/docker-compose.yml exec -T core kill -3 1 || true
          sleep 5
          f="$RUNNER_TEMP/dump.log"
          docker compose -f infra/docker-compose.yml logs --no-color core > "$f" 2>&1 || true
          awk '/"main"/{p=1} p{print} p&&/^$/{exit}' "$f" | head -20 \
            | while IFS= read -r l; do echo "::error title=core main::${l}"; done

      - name: Tear down
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v
